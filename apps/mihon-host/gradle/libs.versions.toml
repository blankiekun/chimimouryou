# Mihon's versions of what extensions link against (mihon gradle/libs.versions.toml): they are
# shipped unshrunk, since an extension may call any of it.
[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
jsoup = "org.jsoup:jsoup:1.23.2"
injekt = "uy.kohesive.injekt:injekt-core:1.16.1"

[bundles]
runtime = ["coroutines", "serialization-json", "serialization-json-okio", "serialization-protobuf", "okhttp", "okhttp-brotli", "okhttp-zstd", "jsoup", "injekt"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# The Android app (apps/android) reads this catalog too, for its Mihon host.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
