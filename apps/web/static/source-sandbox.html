<!doctype html>
<!-- A source extension's frame (lib/data/sources/extension-sandbox.ts, built into
     source-sandbox.js): sandboxed without allow-same-origin by the app, no network of its own. -->
<meta charset="utf-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; form-action 'none'; base-uri 'none'"
/>
<title>Source extension</title>
<script src="source-sandbox.js"></script>
