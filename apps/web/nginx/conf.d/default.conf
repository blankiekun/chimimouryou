server {
  listen 80;

  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Theme guide (themes.md): read in the browser, not downloaded.
  location = /themes.md {
    default_type text/plain;
    charset utf-8;
  }

  error_page 404 /404.html;
  location ~ /404(\.html)?$ {
    internal;
  }
}
