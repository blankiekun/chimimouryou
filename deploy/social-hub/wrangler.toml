# chimimouryou social hub: deploy steps in README.md.
name = "chimi-hub"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "chimi-hub"
# Printed by `npx wrangler d1 create chimi-hub`.
database_id = "cae5b5cd-7328-4910-bb3a-b8d311a80487"

# Retention: sessions unused 90 days, accounts unused 12 months, old rate-limit counters; every
# 10 minutes, expired book transfers (their SDP holds network addresses), Discord statuses and
# pairing codes. Matches TRANSFER_CRON.
[triggers]
crons = ["17 3 * * *", "*/10 * * * *"]

# Edge rate limit per address (Workers Rate Limiting; workers.dev has no WAF rules): 5 requests
# per 10 seconds, checked before any D1 access. period is 10 or 60.
[[ratelimits]]
name = "EDGE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 10 }

# /v1/transfers instead of EDGE_LIMIT: polled about once a second while a book transfer is set up.
[[ratelimits]]
name = "SIGNAL_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 10 }

# Cover thumbnails and pictures (README: `r2 bucket create chimi-hub-media`). Served by the
# Worker at /v1/cover/… and /v1/avatar/… with a year's cache, never as a public bucket.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "chimi-hub-media"

# The Anki add-on's push connections (GET /v1/presence/stream): one PresenceStream per user, holding
# its WebSockets with the hibernation API. SQLite-backed (the free plan's only kind); stores
# nothing. `wrangler deploy` applies the migration once.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceStream"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceStream"]
