# Publishes chimimouryou's standalone web app (no server) to GitHub Pages.
# Copy this file to .github/workflows/pages.yml in the site repository
# (chimireader/chimireader.github.io, served at https://chimireader.github.io),
# set Settings → Pages → Source to "GitHub Actions", and add the repository secrets
# VITE_GDRIVE_CLIENT_ID and VITE_GDRIVE_CLIENT_SECRET (no OneDrive in the standalone)
# (OAuth redirect URI: https://chimireader.github.io/auth). Run it from the Actions tab,
# with a tag such as v1.2.3 or main.
name: Pages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch of blankiekun/chimimouryou to publish
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only main or a release tag: never a pull request's head (refs/pull/N/head) or another branch.
      - name: Check the ref
        env:
          REF: ${{ inputs.ref }}
        run: '[[ "$REF" =~ ^(main|v[0-9.]+)$ ]] || { echo "Publish main or a v* tag, not $REF" >&2; exit 1; }'

      - name: Checkout chimimouryou
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blankiekun/chimimouryou
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the standalone edition
        run: pnpm build
        env:
          VITE_EDITION: standalone
          VITE_STORAGE_ROOT_NAME: chimi-reader-data
          VITE_BASE_PATH: https://chimireader.github.io
          VITE_GDRIVE_CLIENT_ID: ${{ secrets.VITE_GDRIVE_CLIENT_ID }}
          VITE_GDRIVE_CLIENT_SECRET: ${{ secrets.VITE_GDRIVE_CLIENT_SECRET }}

      # Settings → Analysis tools: Sudachi (wasm), Pyodide and yurigana, built from source (~10 min).
      - name: Build the analysis tools
        run: |
          rustup target add wasm32-unknown-unknown
          scripts/analysis-tools/build.sh

      # Settings → Dictionary's one-tap JMdict (EDRDG, CC BY-SA 4.0, see NOTICE), served same-origin.
      - name: Add JMdict
        run: |
          mkdir -p apps/web/build/dictionaries
          curl -fsSL --retry 3 -o apps/web/build/dictionaries/JMdict_english.zip \
            https://github.com/yomidevs/jmdict-yomitan/releases/latest/download/JMdict_english.zip

      # VNBox (Windows games) and its root fs, served same-origin (release assets have no CORS).
      - name: Add VNBox
        run: VNBOX_OUT=apps/web/build/vn/vnbox scripts/vnbox/build.sh

      # Settings → Themes links to the theme guide (the web image copies it the same way).
      - name: Add the theme guide
        run: cp themes.md apps/web/build/themes.md

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
