# Publishes the Docker images to GitHub's container registry when a version tag
# is pushed (git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3), once CI passes:
#   ghcr.io/<owner>/<repository>-{web,services,import,difficulty,mokuro}:{1.2.3,1.2,latest}
# for linux/amd64 and linux/arm64. docker-compose.yml uses them with
# IMAGE_PREFIX=ghcr.io/<owner>/<repository> (see docs/INSTALL.md).
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
          - image: services
            file: docker/services.Dockerfile
            target: base
          - image: import
            file: docker/services.Dockerfile
            target: import
          - image: difficulty
            file: docker/services.Dockerfile
            target: difficulty
          - image: mokuro
            file: docker/services.Dockerfile
            target: mokuro
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Registry names must be lower case.
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.name.outputs.prefix }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub's registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  # Publishes the tag on the standalone site (deploy/pages/pages.yml in PAGES_REPO). Needs the
  # secret PAGES_DISPATCH_TOKEN: a fine-grained token for that repository only, Actions: write.
  pages:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Run the site's Pages workflow
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          PAGES_REPO: ${{ vars.PAGES_REPO || 'chimireader/chimireader.github.io' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No PAGES_DISPATCH_TOKEN: skipping"; exit 0; fi
          gh workflow run pages.yml -R "$PAGES_REPO" -f ref="$GITHUB_REF_NAME"

  # The desktop app (apps/desktop) with the standalone build inside, attached to the tag's GitHub
  # release with the latest*.yml files electron-updater reads. Unsigned. The Google Drive client comes
  # from this repository's secrets VITE_GDRIVE_CLIENT_ID and VITE_GDRIVE_CLIENT_SECRET (the same
  # client as the Pages build); without them the app has no Drive sign-in.
  desktop-inputs:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the standalone edition
        run: pnpm build
        env:
          VITE_EDITION: standalone
          VITE_STORAGE_ROOT_NAME: chimi-reader-data
          VITE_GDRIVE_CLIENT_ID: ${{ secrets.VITE_GDRIVE_CLIENT_ID }}
          VITE_GDRIVE_CLIENT_SECRET: ${{ secrets.VITE_GDRIVE_CLIENT_SECRET }}

      - name: Add the theme guide and Yomitan
        run: |
          cp themes.md apps/web/build/themes.md
          bash apps/desktop/scripts/fetch-yomitan.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-inputs
          path: |
            apps/web/build
            apps/desktop/yomitan
          if-no-files-found: error

  desktop:
    needs: desktop-inputs
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage --x64
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac dmg --universal
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter desktop

      # The artifact's paths are relative to apps/ (their common folder).
      - name: Download the web build and Yomitan
        uses: actions/download-artifact@v4
        with:
          name: desktop-inputs
          path: apps

      - name: Package
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*-Setup-*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  desktop-release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-latest
          path: dist
          merge-multiple: true

      # Uploads to the tag's release, or makes one (edit its notes afterwards).
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "chimimouryou ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
