name: CI
on:
  # Branches are checked through their pull request, main after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Postinstall steps
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Lint
        run: pnpm eslint .

      # svelte-check isn't run: it has 13 known errors from upstream files.
      - name: Unit tests
        run: pnpm test
        working-directory: apps/web

      # Browser tests (*.browser.test.ts) in headless Chromium; the browser is cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: apps/web

      - name: Browser tests
        run: pnpm test:browser
        working-directory: apps/web

      - name: Social hub tests
        run: pnpm --filter chimi-social-hub test

      - name: Desktop shell tests
        run: node --test apps/desktop/serve.test.js apps/desktop/oauth.test.js

      - name: Test build
        run: pnpm build

      # The web app without a server (deploy/pages/pages.yml publishes it).
      - name: Test standalone build
        run: pnpm build
        env:
          VITE_EDITION: standalone
          VITE_STORAGE_ROOT_NAME: chimi-reader-data

  python:
    name: Server scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The services image runs Debian trixie's Python 3.13.
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install yurigana
        # The difficulty scripts import it; its Sudachi dependencies are only needed in the image.
        run: pip install --no-deps "$(grep '^yurigana' scripts/calibre/jiten/requirements.txt)"

      - name: Install Pillow
        # The services image has Debian's python3-pil (covers and thumbnails).
        run: pip install pillow

      - name: Unit tests
        run: python -m unittest discover -s scripts/calibre/tests

      - name: Discord companion (Anki add-on) tests
        run: python -m unittest discover -s apps/anki-discord/tests

      - name: Render the nginx config
        run: scripts/calibre/render-nginx.sh > /dev/null

  # Packages the desktop app (Linux, unpacked) when apps/desktop changes; Front end already lints and
  # tests it. A stub page stands in for the web build, which Front end builds anyway.
  desktop:
    name: Desktop package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Desktop inputs changed?
        id: inputs
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/desktop/|pnpm-lock\.yaml|\.github/workflows/)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.inputs.outputs.build
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        if: steps.inputs.outputs.build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Package
        if: steps.inputs.outputs.build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --filter desktop
          bash scripts/fetch-yomitan.sh
          mkdir -p ../web/build && echo '<!doctype html>' > ../web/build/index.html
          pnpm exec electron-builder --linux dir --publish never

  docker:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
          - image: services
            file: docker/services.Dockerfile
            target: base
          - image: import
            file: docker/services.Dockerfile
            target: import
          - image: difficulty
            file: docker/services.Dockerfile
            target: difficulty
          - image: mokuro
            file: docker/services.Dockerfile
            target: mokuro
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Pull requests build images only when image inputs change (Front end already test-builds the app);
      # main and release tags always build. The job itself always runs: its checks are required.
      - name: Image inputs changed?
        id: inputs
        run: |
          if [ "${{ github.event_name }}" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD | grep -qE '^(docker/|docker-compose|\.dockerignore|scripts/calibre/|package\.json|pnpm-|apps/web/package\.json|themes\.md|\.github/workflows/)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi

      - name: Check the compose files
        run: |
          LIBRARY_PATH=/tmp docker compose --profile import --profile difficulty --profile mokuro config --quiet
          docker compose -f docker-compose.static.yml config --quiet

      - name: Set up Docker Buildx
        if: steps.inputs.outputs.build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        if: steps.inputs.outputs.build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
