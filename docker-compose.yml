# ebook-reader with a Calibre library: copy .env.example to .env, adjust it, then
#   docker compose up -d                          reader, accounts, API, catalog
#   docker compose --profile import up -d         + adding books to Calibre
#   docker compose --profile difficulty up -d     + difficulty estimates
#   docker compose --profile mokuro up -d         + manga OCR (text for Yomitan)
# First admin: the account service creates `admin` with a temporary password, shown by
#   docker compose exec account ebook-account initial-admin   (until it signs in)
# See docs/INSTALL.md (HTTPS, reverse proxies, backups). Builds the images here
# unless IMAGE_PREFIX/IMAGE_TAG name published ones (docker compose pull).
name: ebook-reader

x-services: &services
  build: &services-build
    context: .
    dockerfile: docker/services.Dockerfile
    target: base
  image: ${IMAGE_PREFIX:-ebook-reader}-services:${IMAGE_TAG:-local}
  user: '${PUID:-1000}:${PGID:-1000}'
  restart: unless-stopped
  volumes:
    - ${DATA_PATH:-./data}:/data
  depends_on:
    web:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_HTTPS_URL: ${PUBLIC_HTTPS_URL:-}
        VERSION: ${VERSION:-docker}
    image: ${IMAGE_PREFIX:-ebook-reader}-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TRUSTED_NETWORKS: ${TRUSTED_NETWORKS:-}
      SERVER_NAMES: ${SERVER_NAMES:-}
      REAL_IP_FROM: ${REAL_IP_FROM:-}
      PUBLIC_READS: ${PUBLIC_READS:-0}
      AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library:ro
      - ${VN_PATH:-${DATA_PATH:-./data}/vn}:/vn:ro
      - ${DATA_PATH:-./data}:/data
      - ${SYNC_PATH:-${DATA_PATH:-./data}/sync}:/data/sync

  account:
    <<: *services
    command: ['python3', '/app/account/service.py', 'serve']
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${SYNC_PATH:-${DATA_PATH:-./data}/sync}:/data/sync:ro
    environment:
      MIN_FREE_MB: ${MIN_FREE_MB:-1024}
      ALLOW_HTTP_ACCOUNTS: ${ALLOW_HTTP_ACCOUNTS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  # The v1 API (/api/v1/): catalog, search and reading data in state/api/library.db.
  api:
    <<: *services
    command: ['python3', '/app/api/service.py', 'serve']
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${SYNC_PATH:-${DATA_PATH:-./data}/sync}:/data/sync:ro
    environment:
      MIN_FREE_MB: ${MIN_FREE_MB:-1024}
      VERSION: ${VERSION:-docker}

  # Rebuilds the catalog (and extracts missing covers into the library) when metadata.db
  # or the visual novel folder changes, and makes the library cards' cover thumbnails.
  catalog:
    <<: *services
    command:
      [
        'sh',
        '-c',
        'while :; do build-calibre-catalog /library /data/state/catalog/catalog.json --thumbs; sleep ${CATALOG_INTERVAL:-600}; done'
      ]
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library
      - ${VN_PATH:-${DATA_PATH:-./data}/vn}:/vn:ro

  import:
    <<: *services
    profiles: [import]
    build:
      <<: *services-build
      target: import
    image: ${IMAGE_PREFIX:-ebook-reader}-import:${IMAGE_TAG:-local}
    command: ['python3', '/app/import/service.py']
    environment:
      ALLOW_HTTP_ACCOUNTS: ${ALLOW_HTTP_ACCOUNTS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Sources: seconds between requests to one site; the fake site for tests (docs/CONFIGURATION.md).
      SOURCES_HOST_INTERVAL: ${SOURCES_HOST_INTERVAL:-2}
      SOURCES_CHECK_HOURS: ${SOURCES_CHECK_HOURS:-6}
      SOURCES_FIXTURE_URL: ${SOURCES_FIXTURE_URL:-}
      # Encrypts the passwords of OPDS/Suwayomi servers added as sources; keep it out of DATA_PATH.
      SOURCES_SECRET_KEY: ${SOURCES_SECRET_KEY:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library
      # Game ZIPs are unpacked here; its catalog rebuilds list the visual novels too.
      - ${VN_PATH:-${DATA_PATH:-./data}/vn}:/vn

  difficulty:
    <<: *services
    profiles: [difficulty]
    build:
      <<: *services-build
      target: difficulty
    image: ${IMAGE_PREFIX:-ebook-reader}-difficulty:${IMAGE_TAG:-local}
    command: ['/opt/venv/bin/python', '-W', 'ignore', '/app/jiten/service.py', 'serve']
    # Long background jobs: the reader and accounts come first.
    cpu_shares: 512
    environment:
      JITEN_WORKERS: ${DIFFICULTY_WORKERS:-2}
      ALLOW_HTTP_ACCOUNTS: ${ALLOW_HTTP_ACCOUNTS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # Reads the catalog and token; writes only its own state.
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
      - ${DATA_PATH:-./data}/state/difficulty:/data/state/difficulty
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library:ro
      - ${VN_PATH:-${DATA_PATH:-./data}/vn}:/vn:ro

  # Text of manga pages, made by mokuro here or uploaded as .mokuro files.
  mokuro:
    <<: *services
    profiles: [mokuro]
    build:
      <<: *services-build
      target: mokuro
    image: ${IMAGE_PREFIX:-ebook-reader}-mokuro:${IMAGE_TAG:-local}
    command: ['python3', '/app/mokuro/service.py', 'serve']
    cpu_shares: 512
    environment:
      ALLOW_HTTP_ACCOUNTS: ${ALLOW_HTTP_ACCOUNTS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
      - ${DATA_PATH:-./data}/state/mokuro:/data/state/mokuro
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library:ro
